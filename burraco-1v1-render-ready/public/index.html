<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Burraco 1 vs 1</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <section id="home" class="panel home-panel">
      <div class="brand">
        <div class="brand-card">♥</div>
        <div>
          <p class="eyebrow">PARTITA PRIVATA</p>
          <h1>Burraco <span>1 vs 1</span></h1>
          <p class="subtitle">Crea una stanza e gioca online da due dispositivi diversi.</p>
        </div>
      </div>

      <label>Il tuo nome
        <input id="nameInput" maxlength="20" placeholder="Es. Mattia" autocomplete="nickname" />
      </label>

      <div class="home-actions">
        <button id="createBtn" class="primary">Crea partita</button>
        <div class="divider"><span>oppure</span></div>
        <label>Codice stanza
          <input id="roomInput" maxlength="6" placeholder="ABC123" autocapitalize="characters" />
        </label>
        <button id="joinBtn">Entra nella partita</button>
      </div>
      <p id="homeError" class="error"></p>
    </section>

    <section id="lobby" class="panel hidden">
      <p class="eyebrow">STANZA PRIVATA</p>
      <h2>Codice: <button id="copyCode" class="code-button"></button></h2>
      <p>Invia questo codice all'altra persona. La partita parte automaticamente quando entra.</p>
      <div class="waiting"><span></span> In attesa del secondo giocatore…</div>
    </section>

    <section id="game" class="hidden game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">BURRACO 1 VS 1</p>
          <strong id="roomLabel"></strong>
        </div>
        <div id="turnBadge" class="turn-badge"></div>
      </header>

      <section class="opponent-zone">
        <div class="player-row">
          <div>
            <span id="opponentStatus" class="online-dot"></span>
            <strong id="opponentName">Avversario</strong>
          </div>
          <span id="opponentCount"></span>
        </div>
        <div id="opponentCards" class="opponent-cards"></div>
      </section>

      <section class="table-zone">
        <div class="center-piles">
          <button id="pot1" class="pile pot" disabled><span>POZZETTO 1</span><b>11</b></button>
          <button id="deckBtn" class="pile deck"><span>TALLONE</span><b id="deckCount"></b></button>
          <button id="discardBtn" class="pile discard"><span>SCARTI</span><div id="discardCard"></div></button>
          <button id="pot2" class="pile pot" disabled><span>POZZETTO 2</span><b>11</b></button>
        </div>
        <p id="actionText" class="action-text"></p>
      </section>

      <section class="you-zone">
        <div class="player-row">
          <strong id="youName">Tu</strong>
          <span id="handCount"></span>
        </div>
        <div class="sort-row">
          <button id="sortSuit" class="small">Ordina per seme</button>
          <button id="sortRank" class="small">Ordina per valore</button>
          <button id="discardSelected" class="danger small" disabled>Scarta selezionata</button>
        </div>
        <div id="hand" class="hand"></div>
      </section>

      <p id="gameError" class="error floating-error"></p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
